name: CI

on:
  push:
    branches:
      - main
      - silver
      - staging
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            gcc \
            gnu-efi \
            make

      # The five static checks as one step, which is what `make check-static` is
      # for.  It used to be two of them: `check-abi`, `check-loops` and
      # `check-binary` existed and CI never ran them, so three gates the tree
      # treats as required were green only on a workstation.
      #
      # NOT `make check` — that is the ELF-header inspection, below, and it was
      # here first.
      - name: The static gates (purity, abi, locks, loops, binary)
        run: make check-static

      - name: Host unit suites
        run: make test-unit

      - name: Clean build tree
        run: make clean

      - name: Build IRIS
        run: make

      - name: Inspect kernel ELF
        run: make check

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-build-artifacts
          path: |
            build/kernel.elf
            build/efi_root/EFI/BOOT/BOOTX64.EFI
            build/efi_root/EFI/IRIS/KERNEL.ELF

  smoke-selftests-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            gcc \
            gnu-efi \
            make \
            ovmf \
            qemu-system-x86

      - name: Compile smoke matrix
        run: make smoke

  runtime-smoke:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            gcc \
            gnu-efi \
            make \
            ovmf \
            qemu-system-x86 \
            coreutils

      - name: Run headless runtime smoke
        run: IRIS_QEMU_TIMEOUT_SECS=60 make smoke-runtime

      # The same boot, the same peer and the same assertions against a
      # DIFFERENT card, because the network service has more than one backend
      # now and a backend nothing ever runs is a backend nobody knows is
      # broken.  virtio is the one that can be checked here: the machine has
      # no Intel card and no Realtek card, but every machine can be told to
      # present a virtio device.
      - name: Run headless runtime smoke against virtio-net
        run: IRIS_QEMU_TIMEOUT_SECS=60 make smoke-net-virtio

      # The one check that does not read the serial port, because what it
      # checks is that the serial port is not needed: the kernel log has to be
      # legible on the framebuffer, which is all a real machine usually has.
      - name: Check the boot log reaches the screen
        run: make smoke-screen

      # Two boots over one image, and then a disk this system has no business
      # touching.  The second half is a DATA-SAFETY check, not a feature check:
      # `fs` used to format any disk without an IRIS superblock, which is
      # correct for an image a test made and catastrophic for the second SATA
      # device in a real machine.
      - name: Check persistence, and that a foreign disk is left alone
        run: IRIS_QEMU_TIMEOUT_SECS=180 make smoke-persist

      - name: Upload runtime serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-runtime-log
          path: |
            build/qemu-headless.log
            build/qemu-headless-virtio.log

      - name: Upload what the screen said
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-screen
          path: |
            build/screen/*.txt
            build/screen/serial.log
          if-no-files-found: ignore

  runtime-smoke-selftests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            gcc \
            gnu-efi \
            make \
            ovmf \
            qemu-system-x86 \
            coreutils

      # 180s, not 60.  The suite takes about fifty seconds of wall clock on one
      # processor now and a hosted runner is not faster than a workstation at
      # TCG: Stage 9 step 5's adversarial tests wait out eight ticks of REAL
      # time apiece, and Stage 10-dma step 6's driver waits out six DMA
      # transfers the device schedules a hundred milliseconds apart.  The
      # number is a CEILING and also a cost — `-no-shutdown` means qemu always
      # runs until the deadline — so it is set once with headroom rather than
      # trimmed to the last measurement.
      - name: Run selftest-enabled headless runtime smoke
        run: IRIS_QEMU_TIMEOUT_SECS=180 make ENABLE_RUNTIME_SELFTESTS=1 smoke-runtime-selftests

      # A four-CPU machine, all four started, all four SCHEDULING.  The script
      # gates three separate claims, and they fail independently:
      #   · the MADT walk finds four processors;
      #   · four actually ARRIVED — one that fails to start is reported and
      #     left alone rather than hung on, so without this a machine quietly
      #     running on half its cores looks exactly like a healthy one
      #     (SMP roadmap 9.3 step 3);
      #   · T346's `online=4 dispatching=4` — a processor that arrived and then
      #     halted is online too, and passes both gates above (step 4).
      # The timeout is not scaled here: the script multiplies it by the core
      # count, because TCG emulates four vCPUs at roughly a third of the speed
      # while doing strictly more work, and a timeout reads exactly like a hang.
      - name: Runtime smoke on a 4-CPU machine
        run: IRIS_QEMU_TIMEOUT_SECS=180 IRIS_QEMU_SMP=4 make ENABLE_RUNTIME_SELFTESTS=1 smoke-runtime-selftests

      # Stage 10-run's vertical slice, at one and at four processors.  It is the
      # same headless lane with the same assertions; naming it is what makes the
      # slice a thing CI reports on rather than something a reader has to infer
      # from six greps inside another job.
      - name: Stage 10-run vertical slice (1 and 4 processors)
        run: IRIS_QEMU_TIMEOUT_SECS=180 make ENABLE_RUNTIME_SELFTESTS=1 smoke-stage10

      - name: The executable specification against the kernel (Stage V phase 1)
        run: make spec-differential
        env:
          SPEC_TRACES: 1500

      - name: The rights algebra, over every input (Stage V phase 2)
        run: make spec-rights

      # The lanes CI did not run.  `spec-prove` needs z3 and `spec-abstract`
      # needs Isabelle; both report that they checked NOTHING and return 0 when
      # their prover is absent, because a machine without a prover has missing
      # evidence and not a failure.  z3 is a pip install and worth having here;
      # Isabelle is 2.7 GB and is not, so that lane will skip and say so.
      - name: Install z3 for the proof lane
        run: python3 -m pip install --quiet z3-solver

      - name: The invariants, over every state (Stage V phase 2)
        run: make spec-prove

      - name: Proved == tested (Stage V phase 4's first link)
        run: make spec-bridge

      - name: The abstract specification, and that it matches the model
        run: make spec-abstract

      - name: What one subject can learn from another (Stage V phase 5)
        run: make spec-noninterference

      # Total below a bound, which is the strongest thing any lane here says
      # about the kernel rather than about a model of it.
      - name: Every trace of four operations against the real kernel
        run: make spec-exhaustive

      - name: IRIS-V boots (the verified configuration)
        run: IRIS_QEMU_TIMEOUT_SECS=180 make smoke-verified

      - name: Upload selftest runtime serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-runtime-selftests-log
          # Per PROCESSOR COUNT since the three selftest lanes stopped sharing
          # one file: the smp-4 run used to overwrite an smp-2 failure before
          # anyone could read it.  `build/gate-logs/` is where `scripts/gate.sh`
          # keeps the same evidence per lane.
          path: |
            build/qemu-headless-selftests-smp*.log
            build/qemu-stage10-smp*.log
            build/qemu-verified.log
            build/gate-logs/
          if-no-files-found: ignore
