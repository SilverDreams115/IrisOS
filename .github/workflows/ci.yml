name: CI

on:
  push:
    branches:
      - main
      - silver
      - staging
      - collab
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            gcc \
            gnu-efi \
            make

      - name: Purity gate (frozen legacy-consumer allowlist)
        run: make check-purity

      - name: Lock-order gate (SMP roadmap 9.1)
        run: make check-locks

      - name: Host unit suites
        run: make test-unit

      - name: Clean build tree
        run: make clean

      - name: Build IRIS
        run: make

      - name: Inspect kernel ELF
        run: make check

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-build-artifacts
          path: |
            build/kernel.elf
            build/efi_root/EFI/BOOT/BOOTX64.EFI
            build/efi_root/EFI/IRIS/KERNEL.ELF

  smoke-selftests-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            gcc \
            gnu-efi \
            make \
            ovmf \
            qemu-system-x86

      - name: Compile smoke matrix
        run: make smoke

  runtime-smoke:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            gcc \
            gnu-efi \
            make \
            ovmf \
            qemu-system-x86 \
            coreutils

      - name: Run headless runtime smoke
        run: IRIS_QEMU_TIMEOUT_SECS=60 make smoke-runtime

      - name: Upload runtime serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-runtime-log
          path: build/qemu-headless.log

  runtime-smoke-selftests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            gcc \
            gnu-efi \
            make \
            ovmf \
            qemu-system-x86 \
            coreutils

      - name: Run selftest-enabled headless runtime smoke
        run: IRIS_QEMU_TIMEOUT_SECS=60 make ENABLE_RUNTIME_SELFTESTS=1 smoke-runtime-selftests

      # A four-CPU machine using one of them.  Two things are being checked and
      # only one is obvious: that the MADT walk finds four (the gate inside the
      # script), and that a kernel which enumerates processors it never starts
      # still boots and passes its whole suite.  Getting the second wrong is
      # quiet — the kernel would run perfectly well believing the machine has
      # one CPU (SMP roadmap 9.3 step 3).
      - name: Runtime smoke on a 4-CPU machine (enumeration only)
        run: IRIS_QEMU_TIMEOUT_SECS=60 IRIS_QEMU_SMP=4 make ENABLE_RUNTIME_SELFTESTS=1 smoke-runtime-selftests

      - name: Upload selftest runtime serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-runtime-selftests-log
          path: build/qemu-headless-selftests.log
