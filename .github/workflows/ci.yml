name: CI

on:
  push:
    branches:
      - main
      - silver
      - staging
      - collab
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            gcc \
            gnu-efi \
            make

      - name: Purity gate (frozen legacy-consumer allowlist)
        run: make check-purity

      - name: Lock-order gate (SMP roadmap 9.1)
        run: make check-locks

      - name: Host unit suites
        run: make test-unit

      - name: Clean build tree
        run: make clean

      - name: Build IRIS
        run: make

      - name: Inspect kernel ELF
        run: make check

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-build-artifacts
          path: |
            build/kernel.elf
            build/efi_root/EFI/BOOT/BOOTX64.EFI
            build/efi_root/EFI/IRIS/KERNEL.ELF

  smoke-selftests-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            gcc \
            gnu-efi \
            make \
            ovmf \
            qemu-system-x86

      - name: Compile smoke matrix
        run: make smoke

  runtime-smoke:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            gcc \
            gnu-efi \
            make \
            ovmf \
            qemu-system-x86 \
            coreutils

      - name: Run headless runtime smoke
        run: IRIS_QEMU_TIMEOUT_SECS=60 make smoke-runtime

      - name: Upload runtime serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-runtime-log
          path: build/qemu-headless.log

  runtime-smoke-selftests:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            gcc \
            gnu-efi \
            make \
            ovmf \
            qemu-system-x86 \
            coreutils

      # 180s, not 60.  The suite takes about fifty seconds of wall clock on one
      # processor now and a hosted runner is not faster than a workstation at
      # TCG: Stage 9 step 5's adversarial tests wait out eight ticks of REAL
      # time apiece, and Stage 10-dma step 6's driver waits out six DMA
      # transfers the device schedules a hundred milliseconds apart.  The
      # number is a CEILING and also a cost — `-no-shutdown` means qemu always
      # runs until the deadline — so it is set once with headroom rather than
      # trimmed to the last measurement.
      - name: Run selftest-enabled headless runtime smoke
        run: IRIS_QEMU_TIMEOUT_SECS=180 make ENABLE_RUNTIME_SELFTESTS=1 smoke-runtime-selftests

      # A four-CPU machine, all four started, all four SCHEDULING.  The script
      # gates three separate claims, and they fail independently:
      #   · the MADT walk finds four processors;
      #   · four actually ARRIVED — one that fails to start is reported and
      #     left alone rather than hung on, so without this a machine quietly
      #     running on half its cores looks exactly like a healthy one
      #     (SMP roadmap 9.3 step 3);
      #   · T346's `online=4 dispatching=4` — a processor that arrived and then
      #     halted is online too, and passes both gates above (step 4).
      # The timeout is not scaled here: the script multiplies it by the core
      # count, because TCG emulates four vCPUs at roughly a third of the speed
      # while doing strictly more work, and a timeout reads exactly like a hang.
      - name: Runtime smoke on a 4-CPU machine
        run: IRIS_QEMU_TIMEOUT_SECS=180 IRIS_QEMU_SMP=4 make ENABLE_RUNTIME_SELFTESTS=1 smoke-runtime-selftests

      - name: Upload selftest runtime serial log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iris-runtime-selftests-log
          path: build/qemu-headless-selftests.log
